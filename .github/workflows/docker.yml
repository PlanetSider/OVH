name: Docker

# 自动构建并推送镜像到 GitHub Container Registry（ghcr.io）。
#
# 触发方式：
#   - push 到 main：打 latest / main / sha-<短SHA>，日常提交也能直接拉最新镜像
#   - push v* tag：在语义版本号（1.2.3、1.2）之外仍然维护 latest
#   - 手动 workflow_dispatch：可指定 tag；留空则构建当前分支 HEAD
#
# 仓库里另一个 CI（ci.yml）仍然是纯手动的 —— 那个只跑检查，不构建产物、不碰 Release。
# 这个 workflow 只负责镜像，两者互不干扰。
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（例 v0.4.16）。留空则用当前分支 HEAD"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # 注意：不能直接用 ${{ github.repository }}。
  # 这个账号下已经有一个同名的旧包 ghcr.io/<owner>/ovh（关联在别的仓库上），
  # GITHUB_TOKEN 没有跨仓库写包的权限，push 会报 permission_denied: write_package。
  # 用独立的包名，包会由本仓库的 GITHUB_TOKEN 创建并自动关联到本仓库。
  IMAGE_NAME: ${{ github.repository_owner }}/ovh-console

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 推 ghcr.io 需要这个；用内置的 GITHUB_TOKEN，不必额外配 secret
      packages: write

    steps:
      - name: 取出代码
        uses: actions/checkout@v4
        with:
          # 手动触发且填了 tag 就构建那个 tag，否则构建触发这次的 ref
          ref: ${{ inputs.tag || github.ref }}

      - name: 核对 VERSION 与 tag 是否一致
        # 版本号是通过 ldflags 注入二进制的，前端和自更新都读它。
        # 和 tag 对不上时，用户装了 v0.4.16 的镜像、界面上显示 0.4.15，
        # 自更新还会以为有新版可更 —— 这种不一致很难查，不如在这里直接拦住。
        # main 分支的自动构建没有 tag，跳过这项检查。
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          RAW_REF="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${RAW_REF#v}"
          echo "VERSION 文件: $FILE_VERSION"
          echo "tag:          $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION 文件是 $FILE_VERSION，但 tag 是 $TAG_VERSION —— 两者必须一致"
            exit 1
          fi

      - name: 配置 QEMU
        # 交叉编译本身由 Go 完成（CGO_ENABLED=0），不需要 QEMU 跑构建；
        # 但 alpine 运行时层要拉对应架构的基础镜像，仍然需要 binfmt 支持。
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io 的路径必须全小写，docker/metadata-action 会自动把仓库名转小写
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 分支的每次提交：latest + main + sha-短SHA
            # （手动指定 tag 构建时也会给 latest —— 那是明确的发布动作）
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # v* tag：语义版本号（1.2.3 与 1.2）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 任何触发的可追溯标签，便于回滚到某次提交
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=OVH 控制台
            org.opencontainers.image.description=OVH 服务器抢购 / 监控 / 生命周期管理（PlanetSider fork）
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存存在 GitHub Actions 自己的缓存里，下一次构建前端依赖那层能直接命中
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出拉取命令
        run: |
          echo "### 镜像已推送" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
